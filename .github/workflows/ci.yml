# The gate every pull request has to pass.
#
# Until this existed, nothing verified a PR at all: the deploy workflows trigger
# on `push` to main, so the first thing that noticed a failing suite, a type
# error or a broken build was production. Four pull requests were merged that
# way — they happened to be clean because the checks were run by hand, which is
# not a process, it is a habit.
#
# Deliberately fast, and deliberately parallel: four jobs that each finish in
# two or three minutes rather than one that takes ten. The only thing traded
# away for speed is the *size* of the balance sweep — 20,000 careers stays a
# local command (`pnpm balance`) and this runs a 1,500-career smoke of the same
# harness against the same acceptance criteria.
#
# Nothing else is traded away. The logic sweeps (`rules`) run at their full
# counts, because they exist to find rare faults and a rare fault needs the
# careers to appear in. They were local-only commands until a player found three
# shipped bugs in a week that every one of them would have caught.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # A second push to the same branch makes the first run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The site is published straight from apps/web/dist, so a source file or a
      # sourcemap reaching it would be downloadable from decisionfc.com. This
      # fails the build if one does, so the site serves the minified game and
      # nothing else.
      - name: No source or sourcemaps in the published build
        run: node tools/verify-no-source-leak.mjs

      # The site serves WebP twins of committed PNGs, generated by hand. Content
      # hashes rather than timestamps, because a clone rewrites every mtime.
      - name: Every WebP twin matches its PNG
        run: pnpm verify:artwork

      # The zip in `itch/` is uploaded by hand, so nothing else notices when an
      # engine change leaves it behind. A stale one means players on itch.io
      # report bugs that were fixed weeks ago.
      - name: The itch.io zip was built from this engine
        run: pnpm verify:itch

      # The bundle the leaderboard replays against is built from this commit and
      # has to reproduce this commit's engine exactly, or every submission from
      # the client this PR ships would be rejected as if it were cheated. Cheap
      # to check here, and far cheaper than finding out from the deploy.
      - name: The edge bundle reproduces this engine
        run: |
          node tools/build-edge.mjs
          npx tsx tools/verify-bundle.ts

  # Plays the game.
  #
  # The one class of breakage nothing else here can see: a career that stops
  # advancing, a screen that starts scrolling, an option row that loses the
  # attribute the harness clicks — and, since the desktop shell landed, a single
  # CSS property whose removal quietly puts the rewarded ad back over the whole
  # browser and drops every sheet to the bottom of the window. None of that is a
  # type error, a failing unit test or a build failure, and none of it is
  # something a human reads out of a diff.
  #
  # Its own job so it runs beside `check` rather than after it, and the slowest
  # thing in the file by a distance — a full career is thirty-odd decisions with
  # a reveal animation on each. That is the price of the only check that
  # actually plays the game.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      # `pnpm preview`, not `npx vite preview`: vite is a dependency of
      # apps/web, not of the root, so from the repo root `npx` finds nothing to
      # run and the whole job waits sixty seconds for a server that was never
      # going to start. The root script filters to the workspace that owns it.
      - name: Serve the build
        run: |
          pnpm preview &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then up=1; break; fi
            sleep 1
          done
          [ -n "$up" ] || { echo "preview never came up"; exit 1; }
      # No CHROMIUM here: both tools prefer the dev container's browser when its
      # path exists and let Playwright resolve its own when it does not, which
      # is the case on a runner.
      - name: A whole career on a phone, both languages
        run: pnpm verify:ui
      - name: A whole career on a computer, both languages
        run: pnpm verify:desktop
      - name: The site is still findable
        run: pnpm seo

  # Cheap proof that a change has not moved the game somewhere absurd. The full
  # sweep is 20,000 careers and two minutes; this is 1,500 and about twelve
  # seconds, and it fails on the same acceptance criteria.
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Balance smoke
        run: pnpm balance -- --runs=1500 --assert

  # The three sweeps that check the game's *logic* rather than its numbers, and
  # the reason this job exists at all: every serious bug this project has
  # shipped was caught by one of them, and none of them were running here.
  #
  #   fairness — does choosing an option do what the option said, is every card
  #     actually a decision, are the printed odds the real odds, is any starting
  #     choice quietly worse than the others
  #   market   — does every offer make sense as football: wages, contract
  #     lengths, promised roles, and whether the clubs in one window belong to
  #     the same world
  #   skill    — is it still a game of decisions rather than a slot machine
  #
  # Run at their full default counts. Cutting the run count to save a minute is
  # exactly how a check becomes decorative: these find rare faults, and a rare
  # fault needs the careers to show up in. Together they are about two and a
  # half minutes, in parallel with everything above, so they cost the wall clock
  # nothing.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every option does what it said, and every card is a decision
        run: pnpm fairness --assert
      - name: Every offer reads as football
        run: pnpm market
      - name: Decisions still decide careers
        run: pnpm skill --assert
      # The story audit. It was written for the promoted-Southampton-wins-the-
      # Premier-League class of fault — every stat in range, the story nonsense —
      # and the handbook has called it a mandatory gate since the day it landed.
      # It was never actually wired in here, so the rules it states guarded
      # nothing between one hand-run and the next.
      - name: Every career is a story a fan would believe
        run: pnpm plausibility --assert
